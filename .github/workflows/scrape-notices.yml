name: Scrape notices

on:
  schedule:
    - cron: "0 23 * * *" # daily at 08:00 KST (23:00 UTC)
  workflow_dispatch:
    inputs:
      pages:
        description: "List pages to scan per board"
        default: "3"

permissions:
  contents: read

concurrency:
  group: scrape-notices
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt
          crawl4ai-setup

      - name: Scrape and sync to Firebase
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
          TRANSLATE_SA_JSON: ${{ secrets.TRANSLATE_SA_JSON }}
          PAGES: ${{ inputs.pages || '3' }}
        run: python scraper/scrape_notices.py
